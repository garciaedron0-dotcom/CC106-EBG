<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Dashboard | Student Management</title>
</head>
<body>
    <h1>Welcome, Staff {{ request.user.username }}!</h1>
    <p>You are logged in as an authorized staff member.</p>

    <p>
        <a href="{% url 'student_registration' %}">Register Student</a>
    </p>
    <p>
        <a href="{% url 'student_list' %}">Open Student Directory</a>
    </p>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log Out</button>
    </form>
</body>
</html>
